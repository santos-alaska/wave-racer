<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>INK TIDE</title>
    <style>
      :root { color-scheme: dark; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 100%; height: 100%; overflow: hidden; background: #061024; }
      body { font-family: ui-sans-serif, system-ui, -apple-system, sans-serif; }
      #app { position: fixed; inset: 0; }
      /* WebGL scene */
      #gl { position: absolute; inset: 0; display: block; width: 100%; height: 100%; }
      /* Hand-drawn HUD, rendered with canvas 2D on top of the scene */
      #hud { position: absolute; inset: 0; display: block; width: 100%; height: 100%; pointer-events: none; }
      /* Boot veil — removed by main.ts once the first frame is on screen */
      #boot {
        position: absolute; inset: 0; display: grid; place-items: center;
        background: #061024; color: #cfe9ff; letter-spacing: .35em;
        font-size: 13px; font-weight: 600; text-transform: uppercase;
        transition: opacity .5s ease; z-index: 10;
      }
      #boot.gone { opacity: 0; pointer-events: none; }
    </style>
  </head>
  <body>
    <div id="app">
      <canvas id="gl"></canvas>
      <canvas id="hud"></canvas>
      <div id="boot">Ink Tide</div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
